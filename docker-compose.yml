# Uso:
#   docker compose up -d --build
#   App:        http://localhost:8080
#   phpMyAdmin: http://localhost:8081
#
# Toma APP_KEY, GEMINI_API_KEY y demás variables del archivo .env;
# las variables de "environment" sobrescriben las de .env (p. ej. la BD).

x-app-env: &app-env
  env_file:
    - path: .env
      required: false
  environment:
    APP_ENV: local
    APP_URL: http://localhost:8080
    DB_CONNECTION: mysql
    DB_HOST: db
    DB_PORT: 3306
    DB_DATABASE: tienda_plantas
    DB_USERNAME: tienda
    DB_PASSWORD: tienda
    SESSION_DRIVER: database
    CACHE_STORE: database
    QUEUE_CONNECTION: database
    LOG_CHANNEL: stderr

services:
  db:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: tienda_plantas
      MYSQL_USER: tienda
      MYSQL_PASSWORD: tienda
      MYSQL_ROOT_PASSWORD: root
    volumes:
      - db_data:/var/lib/mysql
    ports:
      - "3307:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "--protocol=tcp", "-uroot", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 20

  app:
    build: .
    image: tienda-plantas:latest
    restart: unless-stopped
    <<: *app-env
    depends_on:
      db:
        condition: service_healthy
    command: >
      sh -c "php artisan storage:link || true;
             php artisan migrate --force &&
             php artisan db:seed --force &&
             php artisan serve --host=0.0.0.0 --port=8080"
    ports:
      - "8080:8080"
    volumes:
      - storage_data:/app/storage/app

  queue:
    image: tienda-plantas:latest
    restart: unless-stopped
    <<: *app-env
    depends_on:
      app:
        condition: service_started
    command: sh -c "sleep 15; php artisan queue:work --tries=3 --sleep=3"

  phpmyadmin:
    image: phpmyadmin:5
    restart: unless-stopped
    environment:
      PMA_HOST: db
      PMA_USER: root
      PMA_PASSWORD: root
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8081:80"

volumes:
  db_data:
  storage_data:
